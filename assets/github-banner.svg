<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="50%" stop-color="#071022"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="22" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow2)"/>

  <!-- Outer Subtle Border -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="21" fill="none" stroke="rgba(0, 102, 255, 0.38)" stroke-width="2"/>

  <!-- Left Terminal Pill -->
  <rect x="64" y="54" width="290" height="34" rx="17" fill="rgba(0, 102, 255, 0.14)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2"/>
  <circle cx="84" cy="71" r="5" fill="#22C55E"/>
  <text x="100" y="76" fill="#93C5FD" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="700" letter-spacing="1.2">
    &gt;_ FULL STACK &amp; FRONTEND
  </text>

  <!-- Main Name & Headline -->
  <text x="62" y="156" fill="#FFFFFF" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">
    Yudi <tspan fill="url(#blueGrad)">@yudizy7</tspan>
  </text>

  <text x="64" y="198" fill="#94A3B8" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="22" font-weight="500">
    Building high-performance web apps, interactive UIs &amp; scalable architectures.
  </text>

  <!-- Bottom Tech Pills -->
  <g transform="translate(64, 232)">
    <rect x="0" y="0" width="138" height="34" rx="8" fill="#0B1325" stroke="rgba(255,255,255,0.1)"/>
    <text x="69" y="22" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="13" font-weight="700" text-anchor="middle">JavaScript / TS</text>

    <rect x="150" y="0" width="122" height="34" rx="8" fill="#0B1325" stroke="rgba(255,255,255,0.1)"/>
    <text x="211" y="22" fill="#38BDF8" font-family="'Consolas', monospace" font-size="13" font-weight="700" text-anchor="middle">React &amp; Next</text>

    <rect x="284" y="0" width="126" height="34" rx="8" fill="#0B1325" stroke="rgba(255,255,255,0.1)"/>
    <text x="347" y="22" fill="#A7F3D0" font-family="'Consolas', monospace" font-size="13" font-weight="700" text-anchor="middle">Node &amp; Python</text>

    <rect x="422" y="0" width="144" height="34" rx="8" fill="#0B1325" stroke="rgba(255,255,255,0.1)"/>
    <text x="494" y="22" fill="#FDE047" font-family="'Consolas', monospace" font-size="13" font-weight="700" text-anchor="middle">UI/UX &amp; Motion</text>
  </g>

  <!-- Right Floating Code Window Illustration -->
  <g transform="translate(770, 48)">
    <rect x="0" y="0" width="370" height="224" rx="16" fill="#050A14" stroke="rgba(0, 102, 255, 0.5)" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="36" rx="16" fill="#0A1224"/>
    <circle cx="20" cy="18" r="5.5" fill="#EF4444"/>
    <circle cx="38" cy="18" r="5.5" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="5.5" fill="#22C55E"/>
    <text x="185" y="22" fill="#64748B" font-family="'Consolas', monospace" font-size="12" text-anchor="middle">yudi@dev: ~/projects</text>

    <text x="24" y="70" fill="#38BDF8" font-family="'Consolas', monospace" font-size="14" font-weight="700">const <tspan fill="#FFFFFF">developer</tspan> = {</text>
    <text x="44" y="96" fill="#94A3B8" font-family="'Consolas', monospace" font-size="13.5">name: <tspan fill="#4ADE80">'Yudi'</tspan>,</text>
    <text x="44" y="120" fill="#94A3B8" font-family="'Consolas', monospace" font-size="13.5">role: <tspan fill="#4ADE80">'Full Stack &amp; Frontend'</tspan>,</text>
    <text x="44" y="144" fill="#94A3B8" font-family="'Consolas', monospace" font-size="13.5">focus: [<tspan fill="#FACC15">'Web Apps'</tspan>, <tspan fill="#FACC15">'UI/UX'</tspan>, <tspan fill="#FACC15">'Cloud'</tspan>],</text>
    <text x="44" y="168" fill="#94A3B8" font-family="'Consolas', monospace" font-size="13.5">status: <tspan fill="#38BDF8">'Open to Work &amp; Projects'</tspan></text>
    <text x="24" y="194" fill="#38BDF8" font-family="'Consolas', monospace" font-size="14" font-weight="700">};</text>
  </g>
</svg>
